[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amre"
version = "1.0.0"
description = "Autonomous Mathematical Research Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.13,<4",
    "networkx>=3.2,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
gr = [
    "sympy>=1.13,<2",
    "mpmath>=1.3,<1.4",
]

[project.scripts]
amre = "amre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
