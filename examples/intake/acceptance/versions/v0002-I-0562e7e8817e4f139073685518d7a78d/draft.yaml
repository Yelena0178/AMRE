content:
  schema_version: 1
  status: DRAFT_UNVERIFIED
  goal:
    id: Goal
    text: 证明 \(\sqrt{2}\notin\mathbb{Q}\)。
    origin: user
    citations:
    - source_id: S-e38879957101320aabb15aae
      start_line: 1
      end_line: 1
      quote: 请根据旧证明笔记整理平方根 2 无理性的研究任务书。沿用互素正整数 p、q 的反证法，把笔记略过的奇偶性步骤列为待完成事项；不新增其他数学假设，不把旧证明认定为已验证。
    note: 保留原目标的无条件结论；下面的有理表示仅是反证法中的临时假设。
  assumptions:
  - id: ContradictionAssumption
    text: 反证法临时假设：存在互素正整数 \(p,q\)，满足 \(\sqrt{2}=p/q\)。
    origin: material
    citations:
    - source_id: S-67fe899ad63041cd3c97b6a1
      start_line: 3
      end_line: 3
      quote: 假设存在互素的正整数 p、q，使 sqrt(2)=p/q。
    note: 这是原笔记的反证法设定，不是向研究目标追加的限制条件。
  definitions: []
  dependencies: []
  existing_results:
  - id: OldArgument
    text: 旧笔记从 \(p^2=2q^2\) 推出 p 为偶数，再写 p=2k 推出 q 为偶数，以此与互素条件矛盾。这里只记录既有论证的内容。
    origin: material
    citations:
    - source_id: S-67fe899ad63041cd3c97b6a1
      start_line: 4
      end_line: 6
      quote: '平方后得到 p²=2q²，因此 p 是偶数。

        写 p=2k，代入得到 q²=2k²，因此 q 也是偶数。

        这与 p、q 互素矛盾，因此 sqrt(2) 不是有理数。'
    note: 既有论证未附独立检验记录，不作为已验证定理或可直接依赖的证据。
  gaps:
  - id: ParityGap
    text: 待证明引理：对所有 \(n\in\mathbb{Z}\)，若 \(n^2\) 为偶数，则 \(n\) 为偶数。后续证明须分别以 n=p 和 n=q
      应用该引理。
    origin: user
    citations:
    - source_id: S-64628f11b18ef351c9aeaa8a
      start_line: 1
      end_line: 1
      quote: 目标保持不变，保留互素表示这个反证法设定。请将平方为偶数推出整数为偶数明确写成适用于所有整数 n 的待证明引理，并注明证明时要分别用于 p
        和 q；不要把这个引理新增为无需证明的假设，也不要标为已经核验。后续验收先采用人工核对，形式化验证暂不要求。
    note: 依据修订指令细化未完成步骤；该引理未加入假设或已验证结果，也未在 Intake 中证明。
  acceptance_criteria:
  - id: CompleteProof
    text: 后续提交完整反证法证明，包括待证明的奇偶性引理及其对 p、q 的两次应用，并取得人工核对记录；本轮不要求形式化验证。
    origin: user
