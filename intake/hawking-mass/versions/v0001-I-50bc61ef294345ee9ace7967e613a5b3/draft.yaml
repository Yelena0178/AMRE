  goal:
    id: Goal
    text: 在四维球对称 Einstein–无质量标量场系统中，由半径方程与两条零方向约束推导 \(m_u,m_v\) 的精确表达式，并逐步展示抵消项。
    origin: user
    citations:
    - source_id: S-71f3e610ecd18445667d38f4
      start_line: 1
      end_line: 5
      quote: '在四维球对称 Einstein–无质量标量场系统中，设 \\(r>0\\)、\\(\Omega>0\\)，定义 Hawking 质量\

        \\[\

        m=\frac r2\left(1+4\Omega^{-2}r_u r_v\right).\

        \\]\

        从半径方程和两条零方向约束推导 \\(m_u\\) 与 \\(m_v\\) 的精确表达式，逐步展示抵消项。'
    note: ''
